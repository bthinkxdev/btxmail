name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements/*.txt }
      - run: pip install -r requirements/dev.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest --cov=apps --cov-report=term-missing
      - run: DJANGO_DEBUG=1 python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  images:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bthinkx-mail/backend:ci backend
      - run: docker build -t bthinkx-mail/web:ci frontend
