<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1b2440" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Offline · BThinkX Mail</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: #f6f7fa; color: #1b2440; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 420px; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { font-size: 1.4rem; margin: 18px 0 8px; }
      p { color: #4a5370; line-height: 1.5; margin: 0 0 20px; }
      a.button { display: inline-block; background: #2747c9; color: #fff; text-decoration: none;
        padding: 12px 20px; border-radius: 8px; font-weight: 600; min-height: 44px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>BThinkX Mail needs a connection to show your domains and mailboxes. Your mail itself is not affected. Check your connection and try again.</p>
      <a class="button" href="/">Try again</a>
    </main>
  </body>
</html>
