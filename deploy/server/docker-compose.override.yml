services:
  web:
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Host: portal.bthinkx.com' http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      internal:
      edge:
      mailcow:
        aliases: [btx-portal]
  backend:
    extra_hosts: ["btxmail.bthinkx.com:host-gateway"]
  worker:
    extra_hosts: ["btxmail.bthinkx.com:host-gateway"]
  beat:
    extra_hosts: ["btxmail.bthinkx.com:host-gateway"]
networks:
  mailcow:
    external: true
    name: mailcowdockerized_mailcow-network
