global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: django
    metrics_path: /metrics
    static_configs: [{ targets: ["backend:8000"] }]
  - job_name: app-node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  # Install node-exporter on the mail server (bound to its private/VPN address) and add it here:
  # - job_name: mail-node
  #   static_configs: [{ targets: ["10.0.0.2:9100"] }]
